<script>
document.addEventListener('DOMContentLoaded', function() {
    console.log('KNOWLEDGE ARCHIVE SCRIPT IS RUNNING!');
    
    // Sidebar toggle functionality
    const sidebarToggle = document.getElementById('ka-sidebarToggle');
    const sidebar = document.getElementById('ka-sidebar');
    const mainContent = document.querySelector('.ka-main-content');
    const container = document.querySelector('.ka-container');

    sidebarToggle.addEventListener('click', function() {
        sidebar.classList.toggle('collapsed');
        mainContent.classList.toggle('expanded');
        
        const toggleIcon = sidebarToggle.querySelector('.toggle-icon');
        const toggleText = sidebarToggle.querySelector('.toggle-text');
        
        if (sidebar.classList.contains('collapsed')) {
            toggleIcon.innerHTML = '<path d="M440-120v-240h80v80h320v80H520v80h-80Zm-320-80v-80h240v80H120Zm160-160v-80H120v-80h160v-80h80v240h-80Zm160-80v-80h400v80H440Zm160-160v-240h80v80h160v80H680v80h-80Zm-480-80v-80h400v80H120Z"/>';
            toggleText.textContent = 'Show Filters';
        } else {
            toggleIcon.innerHTML = '<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>';
            toggleText.textContent = 'Hide Filters';
        }
    });
    
    // Load data and initialize
    fetch('https://pssc.org.ph/wp-content/uploads/PCRNdata.json')
        .then(response => response.json())
        .then(cardData => {
            window.cardData = cardData.sort((a, b) => {
                const getYear = (item) => {
                    if (!item.year || !Array.isArray(item.year) || item.year.length === 0) return -Infinity;
                    const years = item.year.map(y => parseInt(y)).filter(y => !isNaN(y));
                    return years.length > 0 ? Math.max(...years) : -Infinity;
                }

                const yearA = getYear(a);
                const yearB = getYear(b);
                return yearB - yearA;
            });
            currentFilteredData = window.cardData;
            
            populateThemeFilters(window.cardData);
            populateAuthorFilters(window.cardData);
            populateInstitutionFilters(window.cardData); 
            populatePublication_YearFilters(window.cardData);
            populateageFilters(window.cardData);
            populateEntry_TypeFilters(window.cardData);
            populateGeographyFilters(window.cardData);
            populateLanguageFilters(window.cardData);
            populateagetFilters(window.cardData);
            populateKeywordFilters(window.cardData);
            setupFilterEventListeners();
            renderCards(currentFilteredData);
        })
        .catch(error => console.error('Error loading JSON:', error));

    // Modal setup
    const overlay = document.getElementById('ka-overlay'); 
    const modalContent = document.getElementById('ka-modalContent');
    const modalTitle = document.getElementById('ka-modal-title');
    const closeModalBtn = document.getElementById('ka-closeModal');
    const modalImage = document.getElementById('ka-modal-image');
    
    function closeModal() {
        overlay.classList.add('hidden');
    }

    // Show modal with dynamic content
    window.showModal = function(item) {
        let displayYear = 'N/A';
        if (item.year && Array.isArray(item.year) && item.year.length > 0) {
            const years = item.year.map(y => parseInt(y, 10)).filter(y => !isNaN(y));
            if (years.length > 0) {
                displayYear = years.length === 1 ? years[0] : `${Math.min(...years)}-${Math.max(...years)}`;
            }
        }
        
        
        modalTitle.innerHTML = `${item.title}`;

        modalContent.innerHTML = `
            <p><strong>Journal:</strong> ${item.journal || 'N/A'}</p>
            <p><strong>Author(s):</strong> ${item.author || 'N/A'}</p>
            <p><strong>Year:</strong> ${displayYear}</p>
            <p><strong>Volume:</strong> ${displayVolume}</p>
            <p><strong>Tags:</strong> ${item.tags || "N/A"}</p>
            <p><a href="${item.file_link}" target="_blank">View Full Publication</a></p>
        `;
        
        const thumbnailPath = getJournalThumbnail(item.journal);
        if (thumbnailPath) {
            modalImage.innerHTML = `<img src="${thumbnailPath}" alt="${item.journal}" onerror="this.innerHTML='<div class=\\'ka-pdf-placeholder\\'><div class=\\'ka-pdf-icon\\'>📄</div><div class=\\'ka-pdf-text\\'>Image Load Error</div></div>'">`;
        } else {
            modalImage.innerHTML = '<div class="ka-pdf-placeholder"><div class="ka-pdf-icon">📄</div><div class="ka-pdf-text">No Image Available</div></div>';
        }   

        document.getElementById('ka-overlay').classList.remove('hidden');
    }

    closeModalBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    
    let currentPage = 1;
    window.resultsPerPage = 12;
    let currentFilteredData = [];

    function renderCards(cardData) {
        const container = document.getElementById('ka-card-container');
        container.innerHTML = '';
        const startIndex = (currentPage - 1) * window.resultsPerPage;
        const endIndex = startIndex + window.resultsPerPage;
        const pageData = cardData.slice(startIndex, endIndex);

        pageData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'ka-card';
            let displayYear = 'No Year Provided';
            if (item.year && Array.isArray(item.year) && item.year.length > 0) {
                const years = item.year.map(y => parseInt(y, 10)).filter(y => !isNaN(y));
                if (years.length > 0) {
                    displayYear = years.length === 1 ? years[0] : `${Math.min(...years)}-${Math.max(...years)}`;
                }
            }

            let displayAuthor = item.author || '';
            if (displayAuthor.length > 40) {
                const truncatePoint = displayAuthor.lastIndexOf(',',40);
                if (truncatePoint > 0) {
                    displayAuthor = displayAuthor.substring(0, truncatePoint) + ' & more';
                } else {
                    displayAuthor = displayAuthor.substring(0, 32) + '...';
                }
            }
            
            card.innerHTML = `
            <div class="ka-card-image"></div>
                <div class="ka-card-content">
                    <div class="ka-card-title">${item.title}</div>
                    <div class="ka-card-meta">
                        <div class="ka-card-subtitle">${item.journal ? item.journal : ''}</div>
                        <div class="ka-card-author">${displayAuthor}</div>
                        <div class="ka-card-year">${displayYear}</div>
                    </div>
                </div>
            `;

            const imageContainer = card.querySelector('.ka-card-image');
            const thumbnailPath = getJournalThumbnail(item.journal);
            if (thumbnailPath) {
                imageContainer.innerHTML = `<img src="${thumbnailPath}" alt="${item.journal}" onerror="this.parentElement.innerHTML='<div class=\\'ka-pdf-placeholder\\'><div class=\\'ka-pdf-icon\\'>📄</div><div class=\\'ka-pdf-text\\'>No Image</div></div>'">`;
            } else {
                imageContainer.innerHTML = '<div class="ka-pdf-placeholder"><div class="ka-pdf-icon">📄</div><div class="ka-pdf-text">No Image</div></div>';
            }

            card.addEventListener('click', () => showModal(item));
            container.appendChild(card);
        });

        updatePagination(cardData.length);
    }

    
    function adjustInputWidth(input) {
        const value = input.value.toString();
        const length = value.length;
        if (length <= 1) {
            input.style.width = '40px';
        } else if (length === 2) {
            input.style.width = '50px';
        } else {
            input.style.width = '60px';
        }
    }
    
    resultsPerPageInput.addEventListener('input', function() {
        const value = parseInt(resultsPerPageInput.value, 10);
        window.resultsPerPage = isNaN(value) ? 10 : value;
        currentPage = 1;
        adjustInputWidth(this);
        applyFilters();
    }); 

        const sortedYears = Array.from(years).filter(year => !isNaN(year)).sort((a, b) => b - a);

        sortedYears.forEach((year, index) => {
            const checkboxWrapper = document.createElement('div');
            checkboxWrapper.style.marginBottom = '2px';
            checkboxWrapper.style.lineHeight = '1.2';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.id = `ka-year${year}`;
            checkbox.name = 'year';
            checkbox.value = year;
            
            const label = document.createElement('label');
            label.setAttribute('for', `ka-year${year}`);
            label.innerText = year;
            
            checkboxWrapper.appendChild(checkbox);
            checkboxWrapper.appendChild(label);
            
            if (index >= 5) {
                checkboxWrapper.classList.add('ka-year-hidden');
                checkboxWrapper.style.display = 'none';
            }
            
            yearContainer.appendChild(checkboxWrapper);
        });
        
        if (sortedYears.length > 5) {
            const showMoreLink = document.createElement('a');
            showMoreLink.href = '#';
            showMoreLink.className = 'ka-show-more-link year-show-more';
            showMoreLink.textContent = `Show more (${sortedYears.length - 5} more)`;
            
            showMoreLink.addEventListener('click', function(e) {
                e.preventDefault();
                const isExpanded = this.textContent.includes('Show less');
                
                if (isExpanded) {
                    const allWrappers = yearContainer.querySelectorAll('div');
                    
                    for (let i = 5; i < allWrappers.length; i++) {
                        if (allWrappers[i] && !allWrappers[i].querySelector('a')) {
                            allWrappers[i].classList.add('ka-year-hidden');
                            allWrappers[i].style.display = 'none';
                        }
                    }
                    this.textContent = `Show more (${sortedYears.length - 5} more)`;
                } else {
                    const hiddenItems = yearContainer.querySelectorAll('.ka-year-hidden');
                    hiddenItems.forEach(item => {
                        item.classList.remove('ka-year-hidden');
                        item.style.display = 'block';
                    });
                    this.textContent = 'Show less';
                }
            });
            
            yearContainer.appendChild(showMoreLink);
        }
    }

    function setupFilterEventListeners() {
        document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
            checkbox.addEventListener('change', applyFilters);

    const searchInput = document.querySelector('.ka-search-bar input[type="text"]');
    searchInput.addEventListener('input', applyFilters);

        <select id="filter-theme">

        <select id="filter-age">

          placeholder="Search by keyword, title, or abstract..." />
        
        currentPage = 1;
        currentFilteredData = filteredData;

    }

    function updatePagination(totalCards) {
        const totalPages = Math.ceil(totalCards / window.resultsPerPage);
        const pagination = document.getElementById('ka-pagination');
        pagination.innerHTML = '';

        const createButton = (text, disabled, onClick, isActive = false) => {
            const btn = document.createElement('button');
            btn.className = 'ka-pagination-btn';
            btn.textContent = text;
            btn.disabled = disabled;
            if (isActive) {
                btn.style.backgroundColor = '#9A72E5';
                btn.style.color = '#fff';
            }
            btn.onclick = onClick;
            return btn;
        };

        const prevButton = createButton('<', currentPage === 1, () => {
            currentPage--;
            renderCards(currentFilteredData);
        });
        pagination.appendChild(prevButton);

        // Calculate the range of page numbers to show
        const maxVisiblePages = 5;
        let startPage, endPage;
        
        if (totalPages <= maxVisiblePages) {
            // Show all pages if total pages is 5 or fewer
            startPage = 1;
            endPage = totalPages;
        } else {
            // Calculate sliding window around current page
            const halfVisible = Math.floor(maxVisiblePages / 2);
            
            if (currentPage <= halfVisible + 1) {
                // Near the beginning
                startPage = 1;
                endPage = maxVisiblePages;
            } else if (currentPage >= totalPages - halfVisible) {
                // Near the end
                startPage = totalPages - maxVisiblePages + 1;
                endPage = totalPages;
            } else {
                // In the middle
                startPage = currentPage - halfVisible;
                endPage = currentPage + halfVisible;
            }
        }

        // Add first page and ellipsis if needed
        if (startPage > 1) {
            const firstPageBtn = createButton(1, false, () => {
                currentPage = 1;
                renderCards(currentFilteredData);
            });
            pagination.appendChild(firstPageBtn);
            
            if (startPage > 2) {
                const ellipsis = document.createElement('span');
                ellipsis.textContent = '...';
                ellipsis.style.padding = '8px';
                ellipsis.style.color = '#6F4D9E';
                pagination.appendChild(ellipsis);
            }
        }

        // Add page number buttons
        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = createButton(
                i,
                false,
                () => {
                    currentPage = i;
                    renderCards(currentFilteredData);
                },
                i === currentPage
            );
            pagination.appendChild(pageBtn);
        }

        // Add ellipsis and last page if needed
        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                const ellipsis = document.createElement('span');
                ellipsis.textContent = '...';
                ellipsis.style.padding = '8px';
                ellipsis.style.color = '#6F4D9E';
                pagination.appendChild(ellipsis);
            }
            
            const lastPageBtn = createButton(totalPages, false, () => {
                currentPage = totalPages;
                renderCards(currentFilteredData);
            });
            pagination.appendChild(lastPageBtn);
        }

        const nextButton = createButton('>', currentPage >= totalPages, () => {
            if (currentPage < totalPages) {
                currentPage++;
                renderCards(currentFilteredData);
            }
        });
        pagination.appendChild(nextButton);
    }
});
</script>
